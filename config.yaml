# Feature-space example. The standalone API also wraps transformer projections.
model:
  input_dim: 16
  hidden_dim: 32
  num_classes: 4
adapter:
  target_names: [fc1, fc2]
  top_k_ratio: 0.05
  alpha: 12.0
  init_std: 0.001
train:
  seed: 42
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_threads: 1
  save_dir: results/lfma
