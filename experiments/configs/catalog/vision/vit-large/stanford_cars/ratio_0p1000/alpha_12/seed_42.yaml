# Pretrained LFMA experiment: backbone, benchmark, support ratio, scale, seed.
model:
  backbone: vit-large
  revision: null
  cache_dir: .cache/huggingface
  local_dir: null
  offline: false
adapter:
  top_k_ratio: 0.1
  alpha: 12.0
  init_std: 0.001
data:
  task: stanford_cars
  root: datasets
  cache_dir: .cache/datasets
  local_dir: null
  imagefolder: null
  validation_fraction: 0.1
  split_seed: 42
  max_length: 512
  workers: 4
train:
  seed: 42
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  head_learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_accumulation: 1
  precision: fp32
  num_threads: 4
  save_dir: results/catalog/vision/vit-large/stanford_cars/ratio_0p1000/alpha_12/seed_42
