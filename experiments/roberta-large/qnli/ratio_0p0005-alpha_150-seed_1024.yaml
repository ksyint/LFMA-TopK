# Pretrained LFMA experiment: backbone, benchmark, support ratio, scale, seed.
model:
  backbone: roberta-large
  revision: null
  cache_dir: .cache/huggingface
  local_dir: null
  offline: false
adapter:
  top_k_ratio: 0.0005
  alpha: 150.0
  init_std: 0.001
data:
  task: qnli
  root: datasets
  cache_dir: .cache/datasets
  local_dir: null
  imagefolder: null
  validation_fraction: 0.1
  split_seed: 42
  max_length: 512
  workers: 4
train:
  seed: 1024
  epochs: 30
  batch_size: 32
  learning_rate: 0.05
  head_learning_rate: 0.001
  weight_decay: 0.0001
  gradient_accumulation: 1
  precision: fp32
  num_threads: 4
  save_dir: results/catalog/glue/roberta-large/qnli/ratio_0p0005/alpha_150/seed_1024
